name: Apply reviewed R4 entity source
on:
  push:
    branches:
      - feature/0.0.7a-survival-foundation
    paths:
      - '.r4-stage/patch.xz'
permissions:
  contents: write
jobs:
  source:
    if: github.ref == 'refs/heads/feature/0.0.7a-survival-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact R3 base, apply R4, remove transport and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7b4b3a00bfea0b46e45fedffe7ccda515c6a84ec'
          echo '79c27f2b10aca990862abd2a2323b94596cb32f656d94b382ea65bfdb4df3e6d  .r4-stage/patch.xz' | sha256sum -c -
          xz -dc .r4-stage/patch.xz > "$RUNNER_TEMP/r4.patch"
          echo '40b54b8bafd282519e03c79953f94f52f456da82db723d5094c9a780c9e0170a  '"$RUNNER_TEMP/r4.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/r4.patch"
          git apply "$RUNNER_TEMP/r4.patch"
          rm -rf .r4-stage
          rm .github/workflows/apply-r4-source.yml
          git add -A
          git diff --cached --check
          git config user.name 'Foundations CI'
          git config user.email '90636566+Shnewbs@users.noreply.github.com'
          git commit -m "Advance 7a R4: certified vanilla species and durable entity/pickup reference gates"
          git push origin HEAD:feature/0.0.7a-survival-foundation
