name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: source with spaces
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: source with spaces
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Compile and run Java, UI and HTTP regressions
        run: python tools/validate.py
      - name: Build Node and run actual NeoForge Survival spike
        run: python tools/validate_survival_spike.py
      - name: Preserve Survival spike evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: survival-spike-${{ runner.os }}
          path: source with spaces/minecraft-agent/build/reports/survival-spike/*
          if-no-files-found: warn
          retention-days: 14
      - name: Package and rerun development experiment JAR
        if: runner.os == 'Linux'
        run: python tools/package_development.py
      - name: Preserve development experiment bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: survival-development
          path: |
            source with spaces/development-dist/*-EXPERIMENTS.zip
            source with spaces/development-dist/*-EXPERIMENTS.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Exercise Windows launch build scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & tools/build_manager.ps1
          & tools/build_simulator.ps1
          & tools/build_reference.ps1
      - name: Install isolated gateway compiler for validation
        if: runner.os == 'Windows'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and exercise real Conduit bridge and Windows bootstrap
        if: runner.os == 'Windows'
        run: python tools/validate_gateway.py
      - name: Build updater from tested source
        if: runner.os == 'Windows'
        run: python tools/package_updater.py
      - name: Validate updater transactions
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & tests/updater_test.ps1 -Archive (Get-ChildItem dist/*-UPDATER.zip).FullName
      - name: Save tested updater
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-updater
          path: source with spaces/dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-updater
          path: dist
      - name: Publish new version once, after both platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import re,pathlib;print(re.search(r"PACKAGE_REVISION = \"([^\"]+)\"",pathlib.Path("cluster-manager/src/main/java/com/foundations/cluster/manager/ClusterVersion.java").read_text()).group(1))')
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists; immutable assets left unchanged."
          else
            gh release create "v$version" dist/* --target "$GITHUB_SHA" --prerelease --title "Foundations Cluster $version — Worker controls and recovery" --notes-file "release_notes/$version.md"
          fi
  development-release:
    needs: regression
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/0.0.7a-survival-foundation'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: survival-development
          path: development-dist
      - name: Publish clearly separated development experiments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.0.7a-dev.1 >/dev/null 2>&1; then
            echo 'Existing development release is immutable; assets not replaced.'
          else
            gh release create v0.0.7a-dev.1 development-dist/* --target "$GITHUB_SHA" --prerelease --latest=false --title 'Foundations Cluster 0.0.7a-dev.1 — Inventory/save experiments, NOT playable 7a' --notes-file docs/status/0_0_7A_DEVELOPMENT_1.md
          fi
