name: Apply checksum-verified R5 source
on:
  push:
    branches:
      - feature/0.0.7a-survival-foundation
    paths:
      - '.r5-stage/patch.xz'
permissions:
  contents: write
jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Verify pinned base and apply pure-source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '22273ce40d4c620e42ba69d3befbad855b323474'
          echo 'c8af75cb29ff4ec55794b4d0c277d0efc51b258ed7c87199c445d65501f52f05  .r5-stage/patch.xz' | sha256sum -c -
          xz -dc .r5-stage/patch.xz > "$RUNNER_TEMP/R5.patch"
          echo 'a2e2a0f4b1b230701dc9cfebf50f20624088b3427b9a49ac9d77227e31c2d26d  '"$RUNNER_TEMP/R5.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/R5.patch"
          git apply "$RUNNER_TEMP/R5.patch"
          rm -rf .r5-stage
          git add -A
          git diff --cached --check
          git config user.name 'Foundations CI'
          git config user.email '90636566+Shnewbs@users.noreply.github.com'
          git commit -m 'R5: bounded handoff preload and full native entity continuation image'
          git push origin HEAD:feature/0.0.7a-survival-foundation
