plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir('../protocol/src/main/java')
repositories { mavenCentral() }
sourceSets {
    spike {
        java.srcDir('../reference/src/main/java/com/foundations/cluster/replication')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    spikeImplementation.extendsFrom implementation
    spikeRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    version = neo_version
    addModdingDependenciesTo(sourceSets.spike)
    runs {
        server { server(); programArgument '--nogui' }
        client { client() }
        survivalSpike {
            type = 'gameTestServer'
            programArguments = ['--spawnPos', '0,60,0']
            sourceSet = sourceSets.spike
            gameDirectory = layout.buildDirectory.dir('survival-spike-world').get().asFile
            systemProperty 'neoforge.enabledGameTestNamespaces', 'foundations_cluster_spike'
            environment 'FOUNDATIONS_CLUSTER_AGENT_TOKEN', ''
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
        foundations_cluster_spike { sourceSet(sourceSets.spike) }
    }
    runs.server.loadedMods = [mods[mod_id]]
    runs.client.loadedMods = [mods[mod_id]]
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// Generate the entrypoint version from the same property as the artifact metadata.
// The retained source template is otherwise copied unchanged. This prevents stale
// heartbeat versions from disagreeing with a correctly versioned deployment JAR.
def generatedNodeSources = layout.buildDirectory.dir('generated/sources/nodeVersion/java')
tasks.register('generateNodeSource') {
    def template = layout.projectDirectory.file('src/main/templates/FoundationsClusterNode.java.template')
    inputs.file(template)
    inputs.property('nodeVersion', provider { mod_version.toString() })
    outputs.dir(generatedNodeSources)
    doLast {
        def nodeVersion = mod_version.toString()
        if (!(nodeVersion ==~ /[0-9A-Za-z._-]+/)) throw new GradleException('Invalid Node version')
        def code = template.asFile.getText('UTF-8')
        def declaration = /public static final String VERSION = "[^"]+";/
        if ((code =~ declaration).count != 1) throw new GradleException('Node version template must have one declaration')
        def destination = new File(generatedNodeSources.get().asFile, 'com/foundations/cluster/node/FoundationsClusterNode.java')
        destination.parentFile.mkdirs()
        destination.setText(code.replaceFirst(declaration, 'public static final String VERSION = "' + nodeVersion + '";'), 'UTF-8')
    }
}
sourceSets.main.java.srcDir(generatedNodeSources)
tasks.named('compileJava') { dependsOn tasks.named('generateNodeSource') }
